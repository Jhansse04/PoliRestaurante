{% extends "base.html" %}
{% block titulo %}Iniciar sesión · PoliRestaurante{% endblock %}
{% block librerias %}{% endblock %}
{% block contenido %}
<section style="max-width:420px;margin:2rem auto;width:100%">
  <h1>Iniciar sesión</h1>
  <form id="formLogin" class="fila" style="display:grid;gap:.7rem">
    <label>Correo<input type="email" id="correo" required autocomplete="username"></label>
    <label>Contraseña<input type="password" id="contrasena" required autocomplete="current-password"></label>
    <button type="submit">Entrar</button>
  </form>
  <div id="mensaje" class="msg"></div>
</section>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("formLogin").addEventListener("submit", async e => {
    e.preventDefault();
    try {
      const r = await Comun.api("/api/sesion", { method: "POST", cuerpo: {
        correo: document.getElementById("correo").value, contrasena: document.getElementById("contrasena").value } });
      Comun.mostrar("mensaje", r.mensaje, "ok");
      window.location.href = r.redireccion;
    } catch (error) { Comun.fallo("mensaje", error); }
  });
</script>
{% endblock %}
