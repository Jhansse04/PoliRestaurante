<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}PoliRestaurante{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
  <header class="barra">
    <strong>PoliRestaurante</strong>
    {% block encabezado %}{% endblock %}
  </header>
  <main>{% block contenido %}{% endblock %}</main>
  {% block librerias %}<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>{% endblock %}
  <script src="{{ url_for('static', filename='js/comun.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
